name: Windows x64 ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_libhb:
    name: Build LibHB x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cargo-C Toolchain Cache
        id: cargo-c-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
          key: ${{ runner.os }}-${{ runner.arch }}-windows-x64-cargo-c-toolchain

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install automake autoconf build-essential libtool libtool-bin make meson nasm patch tar yasm zlib1g-dev ninja-build gzip pax libssl-dev
          rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW toolchain
        run: |
          wget https://github.com/HandBrake/HandBrake-toolchains/releases/download/1.0/mingw-w64-toolchain-12.0.0-ucrt-linux-x86_64.tar.gz
          echo "43abbe33e79d273da2cd102fe45e196b56b5bc92  mingw-w64-toolchain-12.0.0-ucrt-linux-x86_64.tar.gz" | sha1sum --check --strict
          mkdir toolchains
          tar -xzf mingw-w64-toolchain-12.0.0-ucrt-linux-x86_64.tar.gz -C toolchains

      - name: Install Cargo-C
        if: steps.cargo-c-toolchain.outputs.cache-hit != 'true'
        run: cargo install cargo-c

      - name: Build CLI and LibHB
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/mingw-w64-toolchain-12.0.0-ucrt-linux-x86_64/mingw-w64-x86_64/bin:$PATH"
          export PATH="/usr/bin:$PATH"
          ./configure --cross=x86_64-w64-mingw32 --enable-qsv --enable-vce --enable-nvenc --enable-nvdec --launch-jobs=0 --launch
          cd build
          make pkg.create.zip

      - name: Upload LibHB for the GUI build
        uses: actions/upload-artifact@v7
        with:
          name: LibHandBrake-x64
          path: ./build/libhb/hb.dll
          if-no-files-found: error

  build_gui:
    name: Build Windows x64 GUI and ZIP
    runs-on: windows-2022
    needs: build_libhb
    steps:
      - uses: actions/checkout@v7

      - name: Download LibHB
        uses: actions/download-artifact@v8
        with:
          name: LibHandBrake-x64
          path: win/CS/HandBrakeWPF/bin/publish

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Build Windows GUI
        shell: pwsh
        run: dotnet msbuild win\cs\build.xml /t:x64

      - name: Create ZIP package
        shell: cmd
        run: |
          git rev-parse --short HEAD > gitHash.txt
          set /p gitHash=<gitHash.txt
          set FILENAME=HandBrake-%gitHash%-x64-Win_GUI.exe
          set FILENAMEZIP=HandBrake-%gitHash%-x64-Win_GUI.zip
          cd win/CS/HandBrakeWPF/bin/publish/
          move HandBrake-*-Win_GUI.exe %FILENAME%
          cd ..
          rmdir /q /s Debug
          move publish HandBrake
          7z a %FILENAMEZIP% * -x!Release\ -x!HandBrake\%FILENAME% -x!HandBrake\*.nsi -x!HandBrake\*.config -x!*HandBrake\*.xml -x!*HandBrake\*.pdb -x!*HandBrake\*.bmp -x!HandBrake\*.zip -x!HandBrake\*.bz2 -x!HandBrake\*.msi -mx9

      - name: Upload Windows x64 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: HandBrake-x64-Win_GUI-ZIP
          path: win/CS/HandBrakeWPF/bin/HandBrake-*-x64-Win_GUI.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
